plugins {
    id 'com.android.application'
}

android {
    namespace 'app.nearbuygoods.android'
    compileSdk 34

    defaultConfig {
        applicationId "app.nearbuygoods.android"
        minSdk 24          // Android 7.0+ — ~97% of active devices
        targetSdk 34       // Play Store requirement (2026)
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // For Play Store builds use Android Studio → Build → Generate Signed App Bundle,
            // or uncomment and fill a signingConfig (see docs/ANDROID.md "Release signing").
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero external dependencies on purpose: the product IS the bundled PWA
// (src/main/assets/www, synced from ../public by build-apk.sh) plus one
// dependency-free native shell. No androidx needed → tiny APK, no supply chain.
dependencies {
}
